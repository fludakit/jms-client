site_name: "FluDa JMS Client"
site_description: "A fluent Jakarta Messaging client with CDI wiring and pluggable payload converters."
site_url: https://fludakit.github.io/jms-client/
repo_url: https://github.com/fludakit/jms-client
repo_name: fludakit/jms-client

theme:
  name: material
  logo: https://fludakit.github.io/assets/fluda-badge-light.svg
  favicon: https://fludakit.github.io/assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.footer
    - search.suggest
  icon:
    repo: fontawesome/brands/git-alt

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fludakit

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Jakarta EE: jakarta-ee.md
  - Message Converter: message-converter.md
  - Destination Resolver: destination-resolver.md
  - FluDa Toolkit: https://fludakit.github.io/
